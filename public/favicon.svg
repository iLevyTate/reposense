    <radialGradient id="vignette" cx=".5" cy=".5" r=".72"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
    <clipPath id="clip"><rect width="64" height="64" rx="14"/></clipPath>
    <linearGradient id="deck" x1="0" y1="25.5" x2="0" y2="51.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8a8698"/><stop offset=".55" stop-color="#4a5270"/><stop offset="1" stop-color="#171c2c"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="27.5" x2="0" y2="53.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#0a0d17"/></linearGradient>
    <linearGradient id="rim" x1="14" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#66e0ff"/><stop offset=".5" stop-color="#8f6bff"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient>
    <radialGradient id="fade" cx="20.35" cy="43.55" r="5" gradientUnits="userSpaceOnUse"><stop offset=".1" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient>
    <mask id="tail" maskUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="80"><rect x="-8" y="-8" width="80" height="80" fill="url(#fade)"/></mask>
