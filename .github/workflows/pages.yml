name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The site is static: there is nothing to build, only a syntax gate so a
      # broken module never reaches Pages.
      - name: Check sources parse
        run: |
          for f in $(find src scripts -name '*.js' -o -name '*.mjs'); do
            node --check "$f"
          done

      - name: Refresh the bundled example
        run: node scripts/reposense.mjs . --json --out public/demo.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
