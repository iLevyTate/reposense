name: Visualize

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visualize
  cancel-in-progress: true

jobs:
  render:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The render reads this repository's own git history.
          fetch-depth: 0

      - name: Render the dark variant
        uses: ./
        id: dark
        with:
          output: public/reposense-dark.svg
          theme: dark

      - name: Render the light variant
        uses: ./
        with:
          output: public/reposense-light.svg
          theme: light

      - name: Publish both variants to the output branch
        run: |
          set -euo pipefail
          output_ref=refs/heads/reposense-visuals
          existing=$(git ls-remote --refs origin "$output_ref")
          parents=()
          export GIT_INDEX_FILE="$RUNNER_TEMP/reposense-visuals.index"
          if [[ -n "$existing" ]]; then
            git fetch --no-tags origin "$output_ref"
            previous=$(git rev-parse FETCH_HEAD)
            parents=(-p "$previous")
            git read-tree "$previous"
          else
            git read-tree --empty
          fi

          git add -- public/reposense-dark.svg public/reposense-light.svg
          tree=$(git write-tree)
          if [[ -n "$existing" && "$tree" == "$(git rev-parse "$previous^{tree}")" ]]; then
            echo "Visualization is already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          commit=$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" "${parents[@]}" -m 'chore: refresh the RepoSense visualization')
          git push origin "$commit:$output_ref"
          echo "Published the two variants to reposense-visuals." >> "$GITHUB_STEP_SUMMARY"
